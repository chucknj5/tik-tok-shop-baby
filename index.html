   <div class="empty" style="font-size:12px;padding:6px 0">Scheduled = active people (1st, 2nd, 3rd, Opening, Mid) who do not have that day in DAYS OFF. ${M.dnr?M.dnr+' DNR and ':''}${M.inactive} inactive${M.noShift?' and '+M.noShift+' with no shift set':''} are not counted.</div></div>`;

const GS_CODE="// LAX Weekly Labor Request - Google Sheets backend\n// Paste into Extensions > Apps Script in the Google Sheet, then Deploy > New deployment > Web app\n// (Execute as: Me, Who has access: Anyone). Copy the Web app URL into the page's \"Google Sheet\" box.\n\nconst HEAD_ROWS = ['Week Start','Date','Day','#','Position','Opening HC','Opening Start','Early HC','Early Start','Mid HC','Mid Start','Regular HC','Regular Start','2nd Opening HC','2nd Opening Start','2nd Early HC','2nd Early Start','2nd Mid HC','2nd Mid Start','2nd Regular HC','2nd Regular Start','Total HC','Total Hours','Remarks'];\nconst HEAD_DAILY = ['Week Start','Date','Day','Total HC','Early HC','Regular HC','Total Hours'];\n\nfunction json_(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}\nfunction sheet_(ss,name){return ss.getSheetByName(name)||ss.insertSheet(name)}\n\nfunction doGet(){\n  const sh = sheet_(SpreadsheetApp.getActiveSpreadsheet(),'_data');\n  const n = sh.getLastRow();\n  const txt = n ? sh.getRange(1,1,n,1).getValues().map(r=>r[0]).join('') : '';\n  return ContentService.createTextOutput(txt || '{}').setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction doPost(e){\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try{\n    const p = JSON.parse(e.postData.contents);\n    const ss = SpreadsheetApp.getActiveSpreadsheet();\n    const state = JSON.stringify({weeks:p.weeks, hours:p.hours, dr:p.dr, drMap:p.drMap, punchHC:p.punchHC, savedAt:p.savedAt});\n    const d = sheet_(ss,'_data'); d.clear();\n    const chunks = [];\n    for(let i=0;i\u003cstate.length;i+=40000) chunks.push([state.slice(i,i+40000)]);\n    d.getRange(1,1,chunks.length,1).setValues(chunks);\n    write_(sheet_(ss,'Requests'), HEAD_ROWS, p.rows||[]);\n    write_(sheet_(ss,'Daily Summary'), HEAD_DAILY, p.daily||[]);\n    return json_({ok:true, savedAt:p.savedAt});\n  }catch(err){\n    return json_({ok:false, error:String(err)});\n  }finally{\n    lock.releaseLock();\n  }\n}\n\nfunction write_(sh, head, rows){\n  sh.clear();\n  sh.getRange(1,1,1,head.length).setValues([head]).setFontWeight('bold').setBackground('#0b5d54').setFontColor('#ffffff');\n  if(rows.length) sh.getRange(2,1,rows.length,head.length).setValues(rows);\n  sh.setFrozenRows(1);\n  sh.autoResizeColumns(1, head.length);\n}\n";
const SHEET_DEFAULT='https://script.google.com/macros/s/AKfycbzqlW2clMAczSwSL-PilzjGytdhbK8mBu7zTdtosbPmfPryLumBj6QnhIouV386JEeD/exec';
let SHEET_URL=(()=>{try{return localStorage.getItem('lax_sheet_url')||SHEET_DEFAULT}catch(e){return SHEET_DEFAULT}})();

function payload(){const clean={weeks:{},hours:STATE.hours,dr:STATE.dr,drMap:STATE.drMap,punchHC:STATE.punchHC};weekKeys().forEach(k=>{clean.weeks[k]=STATE.weeks[k]});clean.weeks._extra={dr:STATE.dr,drMap:STATE.drMap,punchHC:STATE.punchHC};clean.savedAt=Date.now();return clean}
function sheetPayload(legacy){
  const p=payload(),rows=[],daily=[],H=STATE.hours;
  weekKeys().forEach(k=>{const w=STATE.weeks[k];
    for(let d=0;d<7;d++){const date=addDays(k,d),day=w.days[d]||{};
      POS.forEach((name,i)=>{const r=day[i];if(!rowHas(r))return;
        const T=rowHC(r),v=x=>r[x]===undefined?'':r[x],row=[k,date,D3[d],i+1,name];
        [1,2].forEach(sh=>['o','e','m','r'].forEach(g=>{row.push(v(g+sh),r['t'+(g==='e'||g==='r'?g:g)+sh]||'')}));
        if(legacy){
          const H2=STATE.hours,E1=num(r.o1)+num(r.e1),E2=num(r.o2)+num(r.e2),eh=(E1+E2)*num(H2.early),rh=(num(r.r1)+num(r.r2)+num(r.m1)+num(r.m2))*num(H2.regular);
          rows.push([k,date,D3[d],i+1,name,E1||'',r.te1||r.to1||'',(num(r.r1)+num(r.m1))||'',r.tr1||r.tm1||'',E2||'',r.te2||r.to2||'',(num(r.r2)+num(r.m2))||'',r.tr2||r.tm2||'',T,eh,rh,rowHrs(r),r.n||'']);
        }else{row.push(T,rowHrs(r),r.n||'');rows.push(row)}
      });
      const t=dayHC(w,d),e=dayEarly(w,d);daily.push([k,date,D3[d],t,e,t-e,dayHrs(w,d)]);
    }});
  p.rows=rows;p.daily=daily;return p;
}
async function sheetGet(){const r=await fetch(SHEET_URL+(SHEET_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();try{return JSON.parse(t||'{}')}catch(e){throw new Error('That URL did not return sheet data. Check the Apps Script deployment is set to Anyone.')}}
let gsTimer=null;
async function save(){
  U.err='';if(U.saving)return;U.saving=true;
  const b=$('#btnSave');if(b){b.disabled=true;b.textContent='Saving…'}
  const st=$('#stat');if(st){st.textContent='Saving…';st.className='stat dirty'}
  try{
    if(SHEET_URL){
      const remote=await sheetGet();
      if(!U.force&&remote.savedAt&&U.saved&&remote.savedAt!==U.saved){U.force=true;throw {code:'newer',message:'Someone saved to the sheet after you opened this. Press Save again to overwrite their version, or reload the page to get it.'}}
      const post=async lg=>{const r=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(sheetPayload(lg))});return JSON.parse(await r.text())};
      let j=await post(false),old=false;
      if(!j.ok&&/number of columns/i.test(String(j.error||''))){j=await post(true);old=!!j.ok}
      if(!j.ok)throw {code:'sheet',message:j.error||'the sheet rejected the save'};
      if(old)toast('Saved. Paste the newest labor Apps Script and redeploy to get Opening columns in the Requests tab.');
      U.dirty=false;U.force=false;U.saved=j.savedAt;toast('Saved to the Google Sheet. Everyone with the page link sees it.');
    }else{
    if(!U.art)U.art=await claude.use('artifact');
    if(!U.art)throw {code:'unavailable',message:'this view cannot save. Open the page from its claude.ai link while signed in.'};
    const p=payload();
    await U.art.publish({'data/state.json':{content:JSON.stringify(p),contentType:'application/json'}});
    U.dirty=false;U.saved=p.savedAt;toast('Saved. Everyone who opens this page now sees it.');
    }
  }catch(e){
    const code=(e&&e.code)||'error',msg=(e&&e.message)||String(e);
    if(code==='conflict')U.err='Someone saved first. Their version is loading, so redo your change and save again.';
    else if(code==='not_writer'||code==='not_granted')U.err='Not saved: you have view-only access to this page.';
    else U.err='Not saved ('+code+'): '+msg;
    toast(U.err);
  }
  U.saving=false;const b2=$('#btnSave');if(b2)b2.textContent='Save for everyone';
  updateStat();
}
async function loadShared(){
  if(SHEET_URL){try{const p=await sheetGet();if(p&&p.weeks&&Object.keys(p.weeks).length&&!U.dirty){applyShared(p);if(p.hours)STATE.hours=Object.assign(STATE.hours,p.hours);if(p.dr)STATE.dr=p.dr;if(p.drMap)STATE.drMap=p.drMap;if(p.punchHC)STATE.punchHC=p.punchHC;U.saved=p.savedAt;render()}else if(p&&p.savedAt)U.saved=p.savedAt}catch(e){U.err='Could not read the Google Sheet: '+e.message;updateStat()}return}
  try{
    const r=await fetch('data/state.json',{cache:'no-store'});if(!r.ok)return;
    const p=await r.json();if(!p||!p.weeks||U.dirty)return;
    applyShared(p);if(p.hours)STATE.hours=Object.assign(STATE.hours,p.hours);if(p.dr)STATE.dr=p.dr;if(p.drMap)STATE.drMap=p.drMap;if(p.punchHC)STATE.punchHC=p.punchHC;U.saved=p.savedAt;render();
  }catch(e){}
}
